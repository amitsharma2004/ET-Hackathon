services:
  - type: web
    name: revenueguard-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python data/generate_data.py && python models/satellite_simulator.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
